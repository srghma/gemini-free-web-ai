[project]
name = "gemini-free-web-ai"
version = "0.2.0"
description = "Local daemon bridge for Google AI Studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7.0",
    "readchar>=4.0.5",
    "pygments>=2.17.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
gemini-bridge = "gemini_bridge.server:main_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_bridge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
